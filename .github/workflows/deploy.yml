name: Deploy Laravel to ECS

on:
  push:
    branches: [ master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::495930421214:role/Laravel-demo-github-action-role
          aws-region: ap-northeast-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t laravel-app:latest .
          docker tag laravel-app:latest 495930421214.dkr.ecr.ap-northeast-1.amazonaws.com/laravel-demo:latest

      - name: Push to ECR
        run: docker push 495930421214.dkr.ecr.ap-northeast-1.amazonaws.com/laravel-demo:latest
